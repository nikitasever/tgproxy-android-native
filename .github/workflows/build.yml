name: Build native POC APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          tg.api_id=${{ secrets.TG_API_ID }}
          tg.api_hash=${{ secrets.TG_API_HASH }}
          EOF

      - name: Write stable debug keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.NATIVE_DEBUG_KEYSTORE_B64 }}" | base64 -d > keystore/debug-native.jks

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tgproxycheck-native-poc-debug
          path: app/build/outputs/apk/debug/app-debug.apk
