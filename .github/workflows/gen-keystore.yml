name: Generate stable debug keystore (one-off)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass tgproxynative2026 \
            -alias tgproxynativedebug \
            -keypass tgproxynative2026 \
            -keyalg RSA -keysize 2048 -validity 20000 \
            -dname "CN=TgProxyCheck Native Debug, OU=Dev, O=nikitasever, L=NA, S=NA, C=RU"
          base64 -w0 debug.keystore > debug.keystore.b64
      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore.b64
